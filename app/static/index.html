<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Local RAG Chatbot</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 750px; 
            margin: 2rem auto; 
            padding: 0 1rem;
        }
        #log { 
            white-space: pre-wrap; 
            border: 1px solid #ccc; 
            padding: 1rem; 
            min-height: 250px; 
            background-color: #f9f9f9;
            margin-bottom: 1rem;
        }
        #msg { 
            width: 70%; 
            padding: 0.5rem; 
        }
        button { 
            padding: 0.5rem 1rem; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <h2>Local RAG Chatbot</h2>
    <div id="log">Bot: Hello! Ask something...</div>
    
    <form id="chatForm">
        <input id="msg" placeholder="Type message..." required />
        <button type="submit">Send</button>
    </form>

    <script>
        const sid = "local-session";
        const log = document.getElementById("log");
        const chatForm = document.getElementById("chatForm");
        const msgInput = document.getElementById("msg");

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = msgInput.value;
            msgInput.value = "";
            
            // Update UI with User message
            log.textContent += `\nYou: ${message}`;
            
            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        session_id: sid, 
                        message: message 
                    })
                });

                if (!response.ok) throw new Error("Server error");

                const data = await response.json();
                
                // Update UI with Bot reply
                log.textContent += `\nBot: ${data.reply}\n`;
            } catch (err) {
                log.textContent += `\nSystem: Error connecting to server.\n`;
            }
            
            // Scroll to bottom
            log.scrollTop = log.scrollHeight;
        });
    </script>
</body>
</html>
